<script>
  const productName = prompt('Type product name');
  const productPrice = Number(prompt('Type product price'));
  const productStock = Number(prompt('Type product stock'));

  const productList = [
    ['Aple', 15000, 10],
    ['Mango', 20000, 20],
    ['Pear', 25000, 25],
  ];

  productList.push([productName, productPrice, productStock]);

  let output = '';
  for (let item of productList) {
    output += `${item[0]}: Rp.${item[1].toLocaleString('id-ID')} (Available Stock ${item[2]}) \n`;
  }

  alert(output);
</script>
